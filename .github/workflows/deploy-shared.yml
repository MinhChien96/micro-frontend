name: Deploy shared

on:
  # Push trigger đã bị xóa: deploy-all.yml đã có paths: shared/**
  # và rebuild toàn bộ MFEs khi shared thay đổi — chạy song song gây cancel.
  # Workflow này chỉ dùng khi cần deploy riêng shared qua GitHub UI.
  workflow_dispatch:

concurrency:
  group: deploy-shared
  cancel-in-progress: true

permissions:
  contents: write

env:
  BASE: https://minhchien96.github.io/micro-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter shared build
        env:
          PUBLIC_URL: ${{ env.BASE }}/shared/

      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: shared/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shared/dist
          destination_dir: shared
          keep_files: true
