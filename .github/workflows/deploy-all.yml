name: Deploy All (full rebuild)

# Dùng cho:
#   - Lần deploy đầu tiên
#   - Khi thay đổi shared/ (store, UI, PermissionGate) — vì shared ảnh hưởng mọi MFE
#   - Khi thay đổi infrastructure (remotes.config.js, pnpm-lock.yaml)
#   - Khi cần full rebuild khẩn cấp
#
# Lý do shared/ → deploy-all thay vì deploy-shared:
#   Khi shared thay đổi cùng lúc với các MFE (1 commit nhiều file),
#   nhiều per-team workflows tranh cùng concurrency group → bị cancel.
#   deploy-all chạy 1 workflow duy nhất → không conflict.
on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - '.github/workflows/**'
      - 'remotes.config.js'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch:

concurrency:
  group: deploy-all
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE: https://minhchien96.github.io/micro-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter shared build
        env:
          PUBLIC_URL: ${{ env.BASE }}/shared/

      - name: Build mfe-auth
        run: pnpm --filter mfe-auth build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-auth/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Build mfe-accounts
        run: pnpm --filter mfe-accounts build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-accounts/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Build mfe-transfer
        run: pnpm --filter mfe-transfer build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-transfer/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Build mfe-cards
        run: pnpm --filter mfe-cards build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-cards/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Build mfe-loans
        run: pnpm --filter mfe-loans build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-loans/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Build mfe-profile
        run: pnpm --filter mfe-profile build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-profile/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Build shell
        run: pnpm --filter shell build
        env:
          PUBLIC_URL: ${{ env.BASE }}/
          BASE_GH_PAGES: ${{ env.BASE }}

      - name: Assemble tất cả vào pages/
        run: |
          mkdir -p pages
          cp -r shell/dist/.        pages/
          cp -r shared/dist         pages/shared
          cp -r mfe-auth/dist       pages/mfe-auth
          cp -r mfe-accounts/dist   pages/mfe-accounts
          cp -r mfe-transfer/dist   pages/mfe-transfer
          cp -r mfe-cards/dist      pages/mfe-cards
          cp -r mfe-loans/dist      pages/mfe-loans
          cp -r mfe-profile/dist    pages/mfe-profile
          touch pages/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Dùng cùng group với per-MFE deploy jobs → xếp hàng tuần tự, không race nhau push gh-pages
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: pages

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          # keep_files: false (default) — full replace khi deploy-all
