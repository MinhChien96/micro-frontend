name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # nightly (cho job e2e)
  workflow_dispatch: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [common, shell, remotes/mfe-auth, remotes/mfe-accounts, remotes/mfe-transfer, remotes/mfe-cards, remotes/mfe-loans, remotes/mfe-profile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./${{ matrix.app }} build

  # E2E nặng (boot 8 server federated) → chỉ chạy nightly + thủ công, không gate PR
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # webServer trong playwright.config.ts tự boot fleet (pnpm start) + chờ shell:3000
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
