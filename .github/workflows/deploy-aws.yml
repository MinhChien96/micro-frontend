# ============================================================================
# REFERENCE deploy AWS cho mô hình CSR static (bank-style, không ECS):
#   build từng app (PUBLIC_URL trỏ CDN) → sync S3 → invalidate CloudFront.
# Chỉ chạy thủ công (workflow_dispatch). Yêu cầu:
#   secrets.AWS_ROLE_ARN (OIDC), vars: AWS_REGION, S3_BUCKET, CDN_DOMAIN,
#   CF_DISTRIBUTION_ID
# Shell build với REMOTE_BASE=CDN → manifest URLs trỏ CDN; deploy lại 1 remote
# chỉ cần chạy lại job với app đó (shell KHÔNG cần rebuild).
# ============================================================================
name: deploy-aws (reference)

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Danh sách app (space-separated dir), rỗng = tất cả"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  static-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build + sync static lên S3 (per app)
        run: |
          DEFAULT="remotes/mfe-auth remotes/mfe-accounts remotes/mfe-transfer remotes/mfe-cards remotes/mfe-loans remotes/mfe-profile shell"
          APPS="${{ github.event.inputs.apps }}"
          for dir in ${APPS:-$DEFAULT}; do
            name=$(basename "$dir")
            echo "--- $name ($dir)"
            PUBLIC_URL="https://${{ vars.CDN_DOMAIN }}/$name/" \
            REMOTE_BASE="https://${{ vars.CDN_DOMAIN }}" \
              pnpm --filter "./$dir" build
            # html + manifest KHÔNG cache; static hashed cache dài (khớp docker/nginx.conf)
            aws s3 sync "$dir/dist/static" "s3://${{ vars.S3_BUCKET }}/$name/static" --delete \
              --cache-control "public,max-age=31536000,immutable"
            aws s3 cp "$dir/dist/static/mf-manifest.json" "s3://${{ vars.S3_BUCKET }}/$name/static/mf-manifest.json" \
              --cache-control "no-cache,no-store,must-revalidate"
            aws s3 sync "$dir/dist/html" "s3://${{ vars.S3_BUCKET }}/$name/html" --delete \
              --cache-control "no-cache,no-store,must-revalidate"
          done

      - name: Invalidate CloudFront (manifest + html)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*/static/mf-manifest.json" "/*/html/*"
