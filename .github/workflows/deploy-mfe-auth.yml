name: Deploy mfe-auth

on:
  push:
    branches: [main]
    paths:
      - 'mfe-auth/**'
  workflow_dispatch:

concurrency:
  group: deploy-mfe-auth
  cancel-in-progress: true

permissions:
  contents: write

env:
  BASE: https://minhchien96.github.io/micro-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter shared build
        env:
          PUBLIC_URL: ${{ env.BASE }}/shared/

      - name: Build mfe-auth
        run: pnpm --filter mfe-auth build
        env:
          PUBLIC_URL: ${{ env.BASE }}/mfe-auth/
          BASE_GH_PAGES: ${{ env.BASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: mfe-auth-dist
          path: mfe-auth/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mfe-auth-dist
          path: mfe-auth/dist

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mfe-auth/dist
          destination_dir: mfe-auth
          keep_files: true
