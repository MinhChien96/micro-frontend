# Nginx serve static CSR cho MỌI app (shell + remotes) — port từ bank.
# Chuỗi chống-stale sau deploy (3 lớp):
#   1. nginx: HTML + mf-manifest.json = NO-CACHE (dưới đây)
#   2. client: registerRemotes(force) + ?t= mỗi lần load (shell/src/remote/load.tsx)
#   3. chunk 404 (hash cũ) → tryForceReload() reload trang đúng 1 lần
server {
    listen 8080;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # HTML entry — SPA fallback, KHÔNG cache để nhận bundle mới ngay sau deploy
    location / {
        root /usr/share/nginx/html/html/main;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # MF manifest — NO-CACHE + CORS: shell phải luôn đọc được bản mới nhất
    # của remote sau mỗi lần deploy (kết hợp ?t= phía client = 2 lớp)
    location = /static/mf-manifest.json {
        alias /usr/share/nginx/html/static/mf-manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # Static assets có hash trong tên → cache dài + immutable; CORS cho
    # shell load chunks cross-origin
    location /static/ {
        alias /usr/share/nginx/html/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # MSW service worker (chỉ có ở build demo MODERN_MSW=true) — không cache
    # để worker cập nhật ngay
    location = /mockServiceWorker.js {
        alias /usr/share/nginx/html/public/mockServiceWorker.js;
        add_header Cache-Control "no-cache" always;
    }

    # Probe cho orchestrator (k8s/ECS/compose healthcheck)
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
