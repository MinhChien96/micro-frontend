# Giả lập hạ tầng production trên máy local (mô hình bank):
#   - Mỗi app = 1 container nginx serve STATIC (build CSR)
#   - Shell nhận remote qua runtime registration → redeploy 1 remote
#     (docker compose up -d --build mfe-cards) KHÔNG cần rebuild shell
#   - LocalStack = S3 (deploy static lên CDN, dùng bởi scripts/deploy-localstack.sh)
# PUBLIC_URL (build arg) = URL browser-facing → chunks load đúng origin từng app
# MODERN_MSW=true (shell) = bundle demo dùng MSW làm backend
name: app-mfe

x-app-defaults: &app-defaults
  restart: unless-stopped

services:
  localstack:
    image: localstack/localstack:latest
    ports: ["4566:4566"]
    environment:
      SERVICES: s3
    volumes:
      - localstack-data:/var/lib/localstack

  mfe-auth:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { APP: remotes/mfe-auth, PUBLIC_URL: "http://localhost:3001/" }
    ports: ["3001:8080"]

  mfe-accounts:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { APP: remotes/mfe-accounts, PUBLIC_URL: "http://localhost:3002/" }
    ports: ["3002:8080"]

  mfe-transfer:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { APP: remotes/mfe-transfer, PUBLIC_URL: "http://localhost:3003/" }
    ports: ["3003:8080"]

  mfe-profile:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { APP: remotes/mfe-profile, PUBLIC_URL: "http://localhost:3005/" }
    ports: ["3005:8080"]

  mfe-loans:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { APP: remotes/mfe-loans, PUBLIC_URL: "http://localhost:3006/" }
    ports: ["3006:8080"]

  mfe-cards:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args: { APP: remotes/mfe-cards, PUBLIC_URL: "http://localhost:3007/" }
    ports: ["3007:8080"]

  # @plop:service (generator chèn service MFE mới bên trên)

  shell:
    <<: *app-defaults
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # MODERN_MSW=true: bản demo tự chạy không cần backend thật.
      # Dự án thật: bỏ MODERN_MSW, set MODERN_API_BASE_URL (xem .env.example)
      args: { APP: shell, PUBLIC_URL: "http://localhost:3000/", MODERN_MSW: "true" }
    ports: ["3000:8080"]
    # Chờ remotes healthy (nginx /health) mới start shell
    depends_on:
      mfe-auth: { condition: service_healthy }
      mfe-accounts: { condition: service_healthy }
      mfe-transfer: { condition: service_healthy }
      mfe-profile: { condition: service_healthy }
      mfe-loans: { condition: service_healthy }
      mfe-cards: { condition: service_healthy }

volumes:
  localstack-data:
